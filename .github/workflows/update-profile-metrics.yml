name: Update profile metrics

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate profile metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile_metrics.py

      - name: Commit updated metrics
        run: |
          if git diff --quiet -- assets/profile-metrics.svg; then
            echo "Profile metrics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-metrics.svg
          git commit -m "chore: update profile metrics"
          git push
