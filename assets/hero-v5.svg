<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
  <title id="title">Abdulrahman Baidaq — AI Engineer</title>
  <desc id="desc">A dark profile banner with an animated signal becoming structured text, representing AI products built from data to delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d18"/><stop offset=".62" stop-color="#10172a"/><stop offset="1" stop-color="#111b2e"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset=".52" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94a3b8" opacity=".08"/></pattern>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .wave{stroke-dasharray:12 10;animation:signal 3.8s linear infinite}.cursor{animation:blink 1.1s steps(2,end) infinite}.spark{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes signal{to{stroke-dashoffset:-88}}@keyframes blink{50%{opacity:.15}}@keyframes pulse{50%{transform:scale(1.5);opacity:.55}}
      @media (prefers-reduced-motion:reduce){.wave,.cursor,.spark{animation:none}}
    </style>
  </defs>
  <rect width="1000" height="240" rx="20" fill="url(#bg)"/><rect x=".75" y=".75" width="998.5" height="238.5" rx="19.25" fill="none" stroke="#26344d" stroke-width="1.5"/><rect width="1000" height="240" rx="20" fill="url(#dots)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="48" y="35" width="147" height="26" rx="13" fill="#8b5cf6" opacity=".13" stroke="#8b5cf6" stroke-opacity=".48"/><circle cx="64" cy="48" r="4" fill="#34d399"/><text x="76" y="52" fill="#c4b5fd" font-size="10.5" font-weight="700" letter-spacing="1.3">BUILDING FLUXTYPE</text>
    <text x="47" y="111" fill="#f8fafc" font-size="43" font-weight="780" letter-spacing="-1.4">ABDULRAHMAN BAIDAQ</text>
    <text x="49" y="146" fill="#cbd5e1" font-size="19" font-weight="560">AI Engineer building useful systems around models.</text>
    <text x="49" y="190" fill="#94a3b8" font-size="13.5">LLM applications</text><circle cx="179" cy="186" r="2.5" fill="#475569"/><text x="192" y="190" fill="#94a3b8" font-size="13.5">Applied ML</text><circle cx="280" cy="186" r="2.5" fill="#475569"/><text x="293" y="190" fill="#94a3b8" font-size="13.5">Product engineering</text>
  </g>
  <g transform="translate(590 33)">
    <rect width="362" height="174" rx="16" fill="#090d18" fill-opacity=".78" stroke="#26344d"/>
    <text x="23" y="30" fill="#64748b" font-family="IBM Plex Mono,Consolas,monospace" font-size="9.5" letter-spacing="1.8">SIGNAL / REASONING / DELIVERY</text>
    <path d="M24 88h18l8-18 12 38 12-63 13 86 12-54 12 24 10-13h19" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="wave" d="M24 88h18l8-18 12 38 12-63 13 86 12-54 12 24 10-13h19" fill="none" stroke="url(#signal)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle class="spark" cx="140" cy="88" r="4" fill="#38bdf8"/>
    <path d="M166 54v74" stroke="#26344d"/>
    <g font-family="IBM Plex Mono,Consolas,monospace" font-size="10.5">
      <text x="190" y="68" fill="#8b5cf6">voice.input</text><text x="190" y="89" fill="#38bdf8">model.evaluate()</text><text x="190" y="110" fill="#34d399">product.deliver()</text><rect class="cursor" x="307" y="100" width="7" height="13" rx="1" fill="#34d399"/>
    </g>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1"><text x="23" y="154" fill="#8b5cf6">SPEAK</text><text x="105" y="154" fill="#38bdf8">UNDERSTAND</text><text x="229" y="154" fill="#34d399">SHIP</text></g>
  </g>
</svg>
