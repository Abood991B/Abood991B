<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
  <title id="title">Abdulrahman Baidaq — AI Engineer</title>
  <desc id="desc">A restrained dark banner introducing Abdulrahman Baidaq and his focus on LLM applications, applied machine learning, and data products.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#39d0ba"/>
    </linearGradient>
  </defs>

  <rect width="900" height="240" rx="16" fill="url(#background)"/>
  <rect x="0.75" y="0.75" width="898.5" height="238.5" rx="15.25" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <rect x="42" y="38" width="4" height="164" rx="2" fill="url(#accent)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="70" y="67" fill="#8b949e" font-size="13" font-weight="650" letter-spacing="2.8">AI ENGINEER</text>
    <text x="68" y="120" fill="#f0f6fc" font-size="42" font-weight="720" letter-spacing="-1.2">ABDULRAHMAN BAIDAQ</text>
    <text x="70" y="160" fill="#c9d1d9" font-size="18" font-weight="500">Reliable AI applications, from evaluation to deployment.</text>
    <text x="70" y="193" fill="#8b949e" font-size="15">LLM applications  ·  Applied machine learning  ·  Data products</text>
  </g>

  <g transform="translate(662 48)" font-family="Inter, Segoe UI, Arial, sans-serif">
