<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Engineering capabilities</title>
  <desc id="desc">Three connected capability areas: AI systems, applied machine learning, and product engineering.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
  <rect width="1000" height="280" rx="20" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="998.5" height="278.5" rx="19.25" fill="none" stroke="#263449" stroke-width="1.5"/>
  <text x="46" y="45" fill="#94a3b8" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" letter-spacing="2.2">THE WORK BETWEEN AN IDEA AND A RELIABLE RELEASE</text>
  <path d="M175 90H825" stroke="url(#route)" stroke-width="2"/>
  <g fill="#0b1220" stroke-width="3"><circle cx="175" cy="90" r="11" stroke="#38bdf8"/><circle cx="500" cy="90" r="11" stroke="#38bdf8"/><circle cx="825" cy="90" r="11" stroke="#34d399"/></g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(45 118)"><text x="0" y="0" fill="#f8fafc" font-size="19" font-weight="700">AI SYSTEMS</text><text x="0" y="32" fill="#cbd5e1" font-size="14">RAG · agents · tools · streaming</text><text x="0" y="58" fill="#94a3b8" font-size="13">Evaluation · guardrails · fallbacks</text><text x="0" y="84" fill="#94a3b8" font-size="13">LangChain · LangGraph · LLM APIs</text></g>
    <g transform="translate(370 118)"><text x="0" y="0" fill="#f8fafc" font-size="19" font-weight="700">APPLIED ML</text><text x="0" y="32" fill="#cbd5e1" font-size="14">NLP · computer vision · comparison</text><text x="0" y="58" fill="#94a3b8" font-size="13">Error analysis · reproducibility</text><text x="0" y="84" fill="#94a3b8" font-size="13">PyTorch · scikit-learn · OpenCV</text></g>
    <g transform="translate(695 118)"><text x="0" y="0" fill="#f8fafc" font-size="19" font-weight="700">PRODUCT ENGINEERING</text><text x="0" y="32" fill="#cbd5e1" font-size="14">APIs · data · interfaces · delivery</text><text x="0" y="58" fill="#94a3b8" font-size="13">FastAPI · React · PostgreSQL</text><text x="0" y="84" fill="#94a3b8" font-size="13">Docker · CI/CD · observability</text></g>
  </g>
</svg>
