<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
  <title id="title">CortexaAI project</title>
  <desc id="desc">A multi-provider workspace for prompt refinement and evaluation.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111b31"/></linearGradient><linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
  <rect width="1000" height="310" rx="20" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="998.5" height="308.5" rx="19.25" fill="none" stroke="#263449" stroke-width="1.5"/>
  <rect x="0" y="0" width="7" height="310" rx="3.5" fill="#38bdf8"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="55" y="58" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="3">AGENTIC SYSTEM · LLM PLATFORM</text>
    <text x="53" y="116" fill="#f8fafc" font-size="46" font-weight="760" letter-spacing="-1">CORTEXA AI</text>
    <text x="55" y="155" fill="#cbd5e1" font-size="19" font-weight="520">A workspace for prompt refinement, evaluation and delivery.</text>
    <text x="55" y="205" fill="#94a3b8" font-size="14">LANGGRAPH  /  MULTI-PROVIDER  /  SSE  /  FASTAPI  /  REACT</text>
    <text x="55" y="257" fill="#f8fafc" font-size="15" font-weight="650">Streaming · batch work · fallback routing · structured evaluation</text>
  </g>
  <g transform="translate(620 44)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="322" height="222" rx="15" fill="#0b1220" stroke="#263449"/>
    <text x="22" y="31" fill="#64748b" font-family="IBM Plex Mono,Consolas,monospace" font-size="10" letter-spacing="1.5">WORKFLOW / ORCHESTRATION</text>
    <path d="M50 105H271" stroke="url(#path)" stroke-width="2"/>
    <g fill="#0b1220" stroke-width="2.5"><circle cx="50" cy="105" r="16" stroke="#38bdf8"/><circle cx="124" cy="105" r="16" stroke="#38bdf8"/><circle cx="198" cy="105" r="16" stroke="#34d399"/><circle cx="272" cy="105" r="16" stroke="#34d399"/></g>
    <g fill="#cbd5e1" font-family="IBM Plex Mono,Consolas,monospace" font-size="9" text-anchor="middle"><text x="50" y="142">CLASSIFY</text><text x="124" y="142">REFINE</text><text x="198" y="142">EVALUATE</text><text x="272" y="142">DELIVER</text></g>
    <g fill="#64748b"><circle cx="48" cy="183" r="4"/><circle cx="69" cy="183" r="4"/><circle cx="90" cy="183" r="4"/><circle cx="111" cy="183" r="4"/><circle cx="132" cy="183" r="4"/><circle cx="153" cy="183" r="4"/></g>
    <text x="180" y="187" fill="#94a3b8" font-family="IBM Plex Mono,Consolas,monospace" font-size="9">PROVIDER ROUTING</text>
