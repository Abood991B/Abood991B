<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Abdulrahman Baidaq — AI Engineer</title>
  <desc id="desc">A dark engineering banner with a subtle animated path from data to model, evaluation, and product.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.62" stop-color="#0d1626"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flow{stroke-dasharray:9 13;animation:flow 7s linear infinite}
      .pulse{animation:travel 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .stage{animation:stage 7s ease-in-out infinite}.s2{animation-delay:1.75s}.s3{animation-delay:3.5s}.s4{animation-delay:5.25s}
      @keyframes flow{to{stroke-dashoffset:-88}}
      @keyframes travel{0%,100%{transform:translateX(0)}25%{transform:translateX(82px)}50%{transform:translateX(164px)}75%{transform:translateX(246px)}}
      @keyframes stage{0%,20%,100%{opacity:.38}8%,14%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.flow,.pulse,.stage{animation:none}}
    </style>
  </defs>

  <rect width="1000" height="360" rx="22" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="998.5" height="358.5" rx="21.25" fill="none" stroke="#263449" stroke-width="1.5"/>
  <rect width="1000" height="360" rx="22" fill="url(#grid)"/>
  <rect x="54" y="51" width="4" height="258" rx="2" fill="url(#accent)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="83" y="80" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="3.8">AI ENGINEER</text>
    <text x="80" y="143" fill="#f8fafc" font-size="49" font-weight="760" letter-spacing="-1.5">ABDULRAHMAN</text>
    <text x="80" y="197" fill="#f8fafc" font-size="49" font-weight="760" letter-spacing="-1.5">BAIDAQ</text>
    <text x="82" y="246" fill="#cbd5e1" font-size="21" font-weight="520">From data and models to dependable software.</text>
    <text x="82" y="286" fill="#94a3b8" font-size="15">LLM applications  ·  Applied machine learning  ·  Data products</text>
  </g>

  <g transform="translate(610 54)">
    <rect width="334" height="252" rx="18" fill="#0b1220" fill-opacity=".82" stroke="#263449"/>
    <text x="25" y="37" fill="#94a3b8" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" letter-spacing="2.1">FROM SIGNAL TO SYSTEM</text>
    <path d="M42 128H288" fill="none" stroke="#334155" stroke-width="2"/>
    <path class="flow" d="M42 128H288" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <g fill="#0b1220" stroke-width="2.5">
      <circle class="stage s1" cx="42" cy="128" r="12" stroke="#38bdf8"/>
      <circle class="stage s2" cx="124" cy="128" r="12" stroke="#38bdf8"/>
      <circle class="stage s3" cx="206" cy="128" r="12" stroke="#34d399"/>
      <circle class="stage s4" cx="288" cy="128" r="12" stroke="#34d399"/>
    </g>
    <circle class="pulse" cx="42" cy="128" r="5.5" fill="#f8fafc" filter="url(#glow)"/>
    <g fill="#cbd5e1" font-family="IBM Plex Mono,Consolas,monospace" font-size="10" text-anchor="middle" letter-spacing="1.1">
      <text x="42" y="166">DATA</text>
      <text x="124" y="166">MODEL</text>
      <text x="206" y="166">EVALUATE</text>
      <text x="288" y="166">PRODUCT</text>
    </g>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="25" y="212" fill="#f8fafc" font-size="16" font-weight="650">The model is one part of the job.</text>
      <text x="25" y="235" fill="#94a3b8" font-size="12.5">Data, evaluation and delivery matter too.</text>
    </g>
  </g>
</svg>
